name: Release ClaudIA CLI
on:
  push:
    tags: ['v[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Package
        id: package
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]
          mkdir -p dist/claudia
          cp claudia install-claudia-all.mjs install-claudia-orchestration.mjs install-claudia-light.mjs repair-claudia-engram.mjs dist/claudia/
          cp -r claudia-model-manager-v2 profiles skills dist/claudia/
          test -x dist/claudia/claudia
          test -f dist/claudia/install-claudia-all.mjs
          test -f dist/claudia/skills/key-manager/key-manager.py
          test -f dist/claudia/claudia-model-manager-v2/tui.tsx
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path('dist/claudia')
          files = []
          for path in sorted(p for p in root.rglob('*') if p.is_file()):
              rel = path.relative_to(root).as_posix()
              files.append({'path': rel, 'sha256': hashlib.sha256(path.read_bytes()).hexdigest()})
          (root / 'package-manifest.json').write_text(json.dumps({'version': os.environ['GITHUB_REF_NAME'], 'files': files}, indent=2) + '\n')
          PY
          tar -czf "dist/claudia-${GITHUB_REF_NAME}.tar.gz" -C dist claudia
          tar -tzf "dist/claudia-${GITHUB_REF_NAME}.tar.gz" | grep -Fx 'claudia/claudia'
          echo "file=dist/claudia-${GITHUB_REF_NAME}.tar.gz" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@daf44fb950173508f38bd2406030372c1d1162b1 # v3.0.0
        with:
          subject-path: ${{ steps.package.outputs.file }}
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse "refs/tags/$GITHUB_REF_NAME^{commit}")" = "$GITHUB_SHA"
          gh release create "$GITHUB_REF_NAME" "${{ steps.package.outputs.file }}" --repo "$GITHUB_REPOSITORY" --generate-notes
